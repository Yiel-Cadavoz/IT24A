<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>

     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     <!-- Make sure you put this AFTER Leaflet's CSS -->
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

     <style>
        #map {height: 500px;}

        .popup-image{
            max-width: 200px;
            height: auto;
        }
     </style>
</head>
<body>
    <h1>Basic Map</h1>
    <div id="map"></div>
</body>
<script>

    var map = L.map('map').setView([8.359645, 124.869147], 17);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

var marker = L.marker([8.359645, 124.869147]).addTo(map);
const dogeImage = "<img src='https://content.api.news/v3/images/bin/d706d884506eeaaed4290da9036a89d5' class='popup-image'";
const popupContent = `${dogeImage}<br><b>Hello world!</b></br>I am a popup.`;

marker.bindPopup(popupContent).openPopup();
</script>
</html>
